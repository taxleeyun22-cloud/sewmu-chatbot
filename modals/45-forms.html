
<!-- ===================== 🗂️ 서식함 (2026-08-17 사장님: "업무 양식·서식도 여기서 보관") ===================== -->
<style>
#formsModal .modal-card{max-width:1000px;width:96vw;height:86vh;max-height:86vh;display:flex;flex-direction:column;border-radius:20px;overflow:hidden}
#formsModal .fm-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--neutral-border);flex:none}
#formsModal .fm-head h2{margin:0;font-size:1.05em;font-weight:800;color:var(--text-main);white-space:nowrap}
#formsModal .fm-head-sub{font-size:.76em;color:var(--text-mute)}
#formsModal .fm-up-btn{margin-left:auto;display:inline-flex;align-items:center;gap:5px;background:var(--brand-primary);color:#fff;border:none;border-radius:10px;padding:8px 14px;font-size:.82em;font-weight:700;cursor:pointer;font-family:inherit}
#formsModal .fm-up-btn:hover{filter:brightness(1.06)}
#formsModal .fm-up-btn:disabled{opacity:.6;cursor:default}
#formsModal .fm-x{background:none;border:none;font-size:1.15em;cursor:pointer;color:var(--text-mute);padding:2px 8px;font-family:inherit}
#formsModal .fm-tools{display:flex;align-items:center;gap:8px;padding:12px 18px 8px;flex:none;flex-wrap:wrap}
#formsModal .fm-search{flex:1;min-width:180px;padding:9px 12px;border:1px solid var(--neutral-border);border-radius:10px;font-size:.85em;font-family:inherit;box-sizing:border-box}
#formsModal .fm-chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 18px 10px;flex:none}
#formsModal .fm-chip{border:1px solid var(--neutral-border);background:#fff;border-radius:999px;padding:5px 11px;font-size:.76em;font-weight:600;color:var(--text-sub);cursor:pointer;font-family:inherit}
#formsModal .fm-chip.on{background:#1e293b;border-color:#1e293b;color:#fff}
#formsModal .fm-chip-n{opacity:.65;font-weight:700;margin-left:2px}
#formsModal .fm-list{flex:1;overflow-y:auto;padding:2px 18px 18px;display:flex;flex-direction:column;gap:8px}
#formsModal .fm-row{display:flex;align-items:center;gap:12px;border:1px solid var(--neutral-border);border-radius:12px;padding:12px 14px;background:#fff}
#formsModal .fm-row:hover{background:#fafbfc}
#formsModal .fm-ico{width:38px;height:38px;flex:none;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#fff;letter-spacing:-.02em}
#formsModal .fm-info{flex:1;min-width:0}
#formsModal .fm-title{font-size:.92em;font-weight:700;color:var(--text-main);line-height:1.35;word-break:keep-all;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#formsModal .fm-cat{font-size:.68em;font-weight:800;border-radius:6px;padding:2px 7px}
#formsModal .fm-ver{font-size:.66em;font-weight:800;background:#eef2ff;color:#4f46e5;border-radius:5px;padding:2px 6px}
#formsModal .fm-desc{font-size:.78em;color:var(--text-sub);margin-top:3px;line-height:1.5;word-break:keep-all}
#formsModal .fm-meta{font-size:.72em;color:var(--text-mute);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap}
#formsModal .fm-acts{display:flex;align-items:center;gap:6px;flex:none}
#formsModal .fm-dl{background:var(--brand-primary);color:#fff;border:none;border-radius:9px;padding:8px 14px;font-size:.8em;font-weight:700;cursor:pointer;font-family:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
#formsModal .fm-dl:hover{filter:brightness(1.06)}
#formsModal .fm-mini{background:#f1f3f6;border:none;border-radius:8px;padding:7px 9px;font-size:.86em;color:var(--text-sub);cursor:pointer;font-family:inherit;font-weight:600}
#formsModal .fm-mini:hover{background:#e5e8ec}
#formsModal .fm-mini.danger{color:var(--brand-danger)}
#formsModal .fm-empty{text-align:center;color:var(--text-sub);padding:44px 14px;font-size:.88em;line-height:1.7}
#formsModal .fm-empty b{display:block;color:var(--text-main);font-size:1.1em;margin-bottom:6px}
#formsModal .fm-hist{margin-top:8px;padding:10px 12px;background:#f8fafc;border:1px solid var(--neutral-border);border-radius:10px;font-size:.76em;color:var(--text-sub);display:flex;flex-direction:column;gap:5px}
#formsModal .fm-hist a{color:var(--brand-primary);font-weight:600;text-decoration:none}
/* 업로드 폼 */
#formsModal .fm-form{display:none;flex-direction:column;gap:10px;padding:14px 18px;border-top:1px solid var(--neutral-border);background:#fafbfc;flex:none}
#formsModal .fm-form.on{display:flex}
#formsModal .fm-form h3{margin:0;font-size:.9em;font-weight:800;color:var(--text-main)}
#formsModal .fm-frow{display:flex;gap:8px;flex-wrap:wrap}
#formsModal .fm-in{flex:1;min-width:180px;padding:10px 12px;border:1px solid var(--neutral-border);border-radius:10px;font-size:.88em;font-family:inherit;box-sizing:border-box}
#formsModal .fm-sel{padding:9px 10px;border:1px solid var(--neutral-border);border-radius:10px;font-size:.85em;font-family:inherit;background:#fff}
#formsModal .fm-file{font-size:.82em;font-family:inherit;color:var(--text-sub)}
#formsModal .fm-hint{font-size:.72em;color:var(--text-mute)}
#formsModal .fm-fbtns{display:flex;gap:8px;align-items:center}
#formsModal .fm-btn{border:none;border-radius:9px;padding:9px 16px;font-size:.85em;font-weight:700;cursor:pointer;font-family:inherit}
#formsModal .fm-btn.save{background:var(--brand-primary);color:#fff}
#formsModal .fm-btn.cancel{background:var(--neutral-border);color:var(--text-main)}
#formsModal .fm-btn:disabled{opacity:.6;cursor:default}
@media (max-width:720px){
  #formsModal .modal-card{width:100vw;height:100vh;max-height:100vh;border-radius:0}
  #formsModal .fm-row{flex-wrap:wrap}
  #formsModal .fm-acts{width:100%;justify-content:flex-end}
}
</style>
<div id="formsModal" class="modal-overlay" style="z-index:11945;display:none">
  <div class="modal-card">
    <div class="fm-head">
      <h2>🗂️ 서식함</h2>
      <span class="fm-head-sub">사내 공용 양식·서식 — 직원 전체 열람</span>
      <button type="button" id="fmUpBtn" class="fm-up-btn" onclick="_fmToggleForm()">＋ 서식 올리기</button>
      <button type="button" class="fm-x" onclick="closeForms()">✕</button>
    </div>
    <div class="fm-tools">
      <input id="fmSearch" class="fm-search" placeholder="서식 이름·설명·파일명 검색" maxlength="60" oninput="_fmSearchDebounced()">
    </div>
    <div class="fm-chips" id="fmChips"></div>
    <div class="fm-list" id="fmList"><div class="fm-empty">불러오는 중...</div></div>
    <div class="fm-form" id="fmForm">
      <h3 id="fmFormHead">＋ 새 서식 올리기</h3>
      <div class="fm-frow">
        <input id="fmTitle" class="fm-in" placeholder="서식 이름 — 예: 위임장 (2026년 양식)" maxlength="200">
        <select id="fmCat" class="fm-sel">
          <option>부가세</option><option>원천세</option><option>종소세</option>
          <option>법인세</option><option>연말정산</option><option>4대보험</option>
          <option>계약·위임</option><option selected>공통</option>
        </select>
      </div>
      <div class="fm-frow">
        <input id="fmDesc" class="fm-in" placeholder="설명 (선택) — 예: 홈택스 대리신고 시 첨부. 도장 필요" maxlength="2000">
      </div>
      <div class="fm-frow" style="align-items:center">
        <input type="file" id="fmFile" class="fm-file">
      </div>
      <div class="fm-hint">한글·워드·엑셀·PDF·이미지·압축 등 (20MB 이하)</div>
      <div class="fm-fbtns">
        <button type="button" class="fm-btn save" id="fmSaveBtn" onclick="_fmSave()">저장</button>
        <button type="button" class="fm-btn cancel" onclick="_fmToggleForm(false)">취소</button>
        <span class="fm-hint" id="fmStatus"></span>
      </div>
    </div>
  </div>
</div>
