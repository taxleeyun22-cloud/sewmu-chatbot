
<!-- 🕘 근태·당번·연차 모달 (2026-10-01 사장님: "직원들 근태 체크 … 연차도 같이 … 당번") — admin-attend.js -->
<style>
#attendModal .modal-card{max-width:1100px;width:96vw;height:88vh;max-height:88vh;display:flex;flex-direction:column;border-radius:20px;overflow:hidden;background:#fff}
#attendModal .at-top{display:flex;align-items:center;gap:10px;padding:14px 18px 10px;border-bottom:1px solid var(--neutral-border);flex:none;flex-wrap:wrap}
#attendModal .at-top h2{margin:0;font-size:1.05em;font-weight:800;color:var(--text-main);white-space:nowrap}
#attendModal .at-x{background:none;border:none;font-size:1.15em;cursor:pointer;color:var(--text-mute);padding:2px 8px;font-family:inherit;margin-left:auto}
#attendModal .at-tabs{display:flex;gap:5px;flex-wrap:wrap;flex:1;min-width:0}
#attendModal .at-tab{background:#f2f4f6;border:none;border-radius:8px;padding:6px 12px;font-size:.78em;font-weight:700;color:var(--text-sub);cursor:pointer;font-family:inherit;white-space:nowrap}
#attendModal .at-tab.on{background:#191f28;color:#fff}
#attendModal .at-tab .n{background:var(--brand-danger);color:#fff;border-radius:999px;padding:0 6px;margin-left:4px;font-size:.9em}
#attendModal .at-body{flex:1;overflow:auto;padding:14px 18px;font-size:.84em;color:var(--text-main)}
#attendModal .at-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
#attendModal .at-bar .sp{flex:1}
#attendModal .at-btn{background:#f2f4f6;border:none;border-radius:8px;padding:6px 12px;font-size:.92em;font-weight:700;color:var(--text-sub);cursor:pointer;font-family:inherit;white-space:nowrap}
#attendModal .at-btn.pri{background:var(--brand-primary);color:#fff}
#attendModal .at-btn.dng{color:var(--brand-danger)}
#attendModal .at-empty{text-align:center;color:var(--text-mute);padding:30px 10px;line-height:1.6}
#attendModal .at-note{background:#fffbeb;border:1px solid #fde68a;color:#92600a;border-radius:10px;padding:8px 12px;margin-bottom:12px;font-weight:600;line-height:1.55}
#attendModal table{border-collapse:collapse;width:100%}
#attendModal th,#attendModal td{border-bottom:1px solid #f2f4f6;padding:7px 8px;text-align:left;white-space:nowrap}
#attendModal th{font-size:.9em;color:var(--text-mute);font-weight:700;background:#fafbfc;position:sticky;top:0;z-index:1}
#attendModal .at-grid td,#attendModal .at-grid th{text-align:center;padding:5px 4px;font-size:.88em;min-width:44px}
#attendModal .at-grid td.nm,#attendModal .at-grid th.nm{text-align:left;position:sticky;left:0;background:#fff;z-index:2;min-width:70px}
#attendModal .at-grid th.nm{background:#fafbfc;z-index:3}
#attendModal .at-grid td.we{background:#fafbfc}
#attendModal .at-grid td.click{cursor:pointer}
#attendModal .at-grid td.click:hover{background:#eff6ff}
#attendModal .late{color:var(--brand-danger);font-weight:800}
#attendModal .miss{color:#adb5bf}
#attendModal .pill{display:inline-block;border-radius:999px;padding:2px 8px;font-size:.86em;font-weight:800;white-space:nowrap}
#attendModal .pill.duty{background:#eff6ff;color:#1d4ed8}
#attendModal .pill.leave{background:#f5f3ff;color:#6d28d9}
#attendModal .pill.late{background:#fef2f2;color:var(--brand-danger)}
#attendModal .pill.ok{background:#ecfdf5;color:#059669}
#attendModal .pill.gray{background:#f2f4f6;color:var(--text-sub)}
#attendModal .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#1d4ed8;vertical-align:middle;margin-right:2px}
#attendModal input[type=date],#attendModal input[type=time],#attendModal input[type=number],#attendModal input[type=month],#attendModal select{border:1px solid var(--neutral-border);border-radius:7px;padding:4px 7px;font-size:.95em;font-family:inherit;background:#fff;color:var(--text-main)}
#attendModal .at-sec{margin:18px 0 8px;font-weight:800;color:var(--text-sub)}
#attendModal .at-ord{display:flex;flex-direction:column;gap:4px;max-width:360px}
#attendModal .at-ord div{display:flex;align-items:center;gap:6px;background:#f8f9fa;border-radius:8px;padding:5px 8px}
#attendModal .at-ord div b{flex:1}
@media (max-width:720px){
  #attendModal .modal-card{width:100vw;height:100vh;max-height:100vh;border-radius:0}
  #attendModal .at-body{padding:12px}
}
</style>
<div id="attendModal" class="modal-overlay" style="z-index:11935;display:none">
  <div class="modal-card">
    <div class="at-top">
      <h2>🕘 근태·연차</h2>
      <div class="at-tabs" id="atTabs"></div>
      <button type="button" class="at-x" onclick="closeAttend()">✕</button>
    </div>
    <div class="at-body" id="atBody"><div class="at-empty">불러오는 중...</div></div>
  </div>
</div>
